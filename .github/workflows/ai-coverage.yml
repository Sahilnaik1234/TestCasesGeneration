name: Run AI Test Case Generator

# This ensures the CI only runs when a PR is opened or updated targeting 'dev'
on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  coverage-and-ai-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the pull request HEAD commit instead of the merge commit
          ref: ${{ github.event.pull_request.head.ref }}

      # Add your own testing command here!
      # For example: 
      # - npm test --coverage (for JS/TS)
      # - pytest --cov=src --cov-report=xml (for Python)
      # - mvn test jacoco:report (for Java)
      - name: Your Language Test Suite
        run: |
          echo "Assuming your test tool outputs coverage.xml or jacoco.xml..."
          # Put your test commands here. We use '|| true' so the CI continues to AI generation even if tests fail
          # npm run test || true

      - name: AI Coverage Booster
        uses: ./
        with:
          coverage_file: 'coverage.xml' # Change to whatever your tool emits (e.g., target/site/jacoco/jacoco.xml)
          threshold: '75.0'
          provider: 'groq' 
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
