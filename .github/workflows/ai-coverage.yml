name: Run AI Test Case Generator

# This ensures the CI only runs when a PR is opened or updated targeting 'dev'
on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  coverage-and-ai-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the pull request HEAD commit instead of the merge commit
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Generate Real Python Coverage
        run: |
          pip install pytest coverage pytest-cov
          # The '|| true' ensures the pipeline continues even if tests fail (which they might initially)
          coverage run --source=example,src -m pytest || true
          coverage xml -o python_coverage.xml || true

      - name: Generate Real Java Coverage
        run: |
          # Run Maven to generate JaCoCo coverage report
          mvn clean test jacoco:report || true

      - name: AI Coverage Booster (Python)
        uses: ./
        with:
          coverage_file: 'python_coverage.xml'
          threshold: '75.0'
          provider: 'groq' 
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          
      - name: AI Coverage Booster (Java)
        uses: ./
        with:
          coverage_file: 'target/site/jacoco/jacoco.xml'
          threshold: '75.0'
          provider: 'groq' 
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
