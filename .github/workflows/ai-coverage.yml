name: Run AI Test Case Generator

# This ensures the CI only runs when a PR is opened or updated targeting 'dev'
on:
  pull_request:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  coverage-and-ai-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the pull request HEAD commit instead of the merge commit
          ref: ${{ github.event.pull_request.head.ref }}

      # --- Replace this section with your actual language testing tools ---
      # For example: generate a coverage.xml using pytest or jacoco
      - name: Generate Dummy Coverage 
        run: |
          echo "Run your actual unit tests here to generate coverage.xml"
          # Mocking a coverage file for demonstration
          echo '<coverage line-rate="0.5"><packages><package><classes><class name="example.py" filename="example.py" line-rate="0.5" /></classes></package></packages></coverage>' > coverage.xml
      # ------------------------------------------------------------------

      - name: AI Coverage Booster
        # We are using the action defined in this very repository for testing
        uses: ./
        with:
          coverage_file: 'coverage.xml'
          threshold: '75.0'
          provider: 'groq' # You can change this to 'claude' or 'gemini'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
